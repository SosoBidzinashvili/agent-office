<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chveni Sopeli · Garage — cozy agent office</title>
<style>
  :root{
    --wood:#6b4326; --wood2:#4a2c18; --cream:#f2e6cc; --teal:#3f8f88; --amber:#e0a24a;
    --panel:#2a2018; --line:#7a5a38;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Trebuchet MS","Segoe UI",system-ui,"Noto Sans Georgian",sans-serif;
    background:radial-gradient(1100px 560px at 50% -8%, #3b2c1e 0%, #241a12 55%, #17110c 100%);
    color:var(--cream);min-height:100vh;padding:18px 14px 40px}
  .wrap{max-width:1500px;margin:0 auto}
  .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#4f9a92,#2f6f68);
    display:grid;place-items:center;font-size:24px;box-shadow:0 6px 18px #0007,inset 0 2px 0 #ffffff22}
  h1{font-size:clamp(17px,2.5vw,24px);margin:0;color:#f6ecd4;text-shadow:0 2px 0 #0006}
  .tagline{font-size:12px;color:#c9b48c;margin-top:1px}.tagline b{color:var(--amber)}
  .controls{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
    background:#2a2018cc;border:1px solid var(--line);border-radius:14px;padding:9px;box-shadow:0 6px 18px #0006}
  .controls input{border:1px solid var(--line);background:#1c140d;color:var(--cream);
    padding:9px 12px;border-radius:9px;font-family:inherit;font-size:13px;min-width:190px;flex:1 1 180px}
  .controls input:focus{outline:2px solid var(--amber)}
  button{font-family:inherit;font-weight:700;cursor:pointer;border:none;border-radius:9px;
    padding:9px 13px;font-size:13px;color:#241a12;background:var(--amber);transition:.15s}
  button:hover{transform:translateY(-1px);filter:brightness(1.06)}
  button.go{background:linear-gradient(135deg,#5cc0b6,#2f8f85);color:#08201e;box-shadow:0 4px 12px #2f8f8555}
  button.chip{background:#3a2c1e;color:#e8d3a0;border:1px solid var(--line)}
  button.chip:hover{background:var(--teal);color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none}

  .frame{position:relative;width:100%;border:6px solid #3a2c1e;border-radius:16px;display:flex;align-items:center;justify-content:center;
    overflow:hidden;box-shadow:0 24px 60px #000a,inset 0 0 0 2px #6b4a2e;background:#17110c}
  .view{position:relative;width:100%;aspect-ratio:512/320;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
  .overlay{position:absolute;inset:0;pointer-events:none}
  .rlabel{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:10px;font-weight:800;
    color:#fff6df;background:#2a2018d0;border:1px solid #7a5a38;padding:1px 8px;border-radius:7px;
    letter-spacing:.3px;box-shadow:0 2px 5px #0006}
  .tag{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:9px;font-weight:800;text-align:center;
    color:#fff;background:#241a12cc;padding:1px 6px;border-radius:6px;line-height:1.15;box-shadow:0 1px 3px #0007;z-index:5}
  .tag .rl{display:block;font-size:7.5px;font-weight:600;color:#f0d9a8;opacity:.9}
  .bub{position:absolute;transform:translate(-50%,-100%) scale(.5);opacity:0;transition:.14s;z-index:20;
    background:#fff8e8;color:#241a12;font-size:13px;font-weight:800;padding:3px 9px;border-radius:11px;
    white-space:nowrap;box-shadow:0 4px 12px #0008;border:1.5px solid #d8c298}
  .bub.show{opacity:1;transform:translate(-50%,-100%) scale(1)}
  .bub::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#fff8e8}
  .bub.think{background:#eef4ff;border-color:#c3d3ee;border-radius:14px}
  .bub.think::after{border:none;width:6px;height:6px;background:#eef4ff;border:1.5px solid #c3d3ee;border-radius:50%;
    left:40%;top:calc(100% + 1px);box-shadow:-5px 4px 0 -1px #eef4ff, -4px 4px 0 0 #c3d3ee}
  .ticket{position:absolute;transform:translate(-50%,-100%);background:#fff;border-left:3px solid var(--teal);
    padding:2px 6px;border-radius:4px;font-size:9px;font-weight:800;color:#241a12;box-shadow:0 4px 10px #0008;
    max-width:120px;opacity:0;transition:opacity .3s;z-index:15}
  .stamp{position:absolute;transform:translate(-50%,-50%) rotate(-11deg) scale(.4);opacity:0;transition:.2s;z-index:25;
    font-weight:900;font-size:14px;padding:4px 10px;border-radius:8px;border:3px solid;background:#fff6df;color:#241a12}
  .stamp.show{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}
  .stamp.ok{border-color:var(--teal);color:#1f6f68}.stamp.bad{border-color:#c0503f;color:#a83a2c}

  .statusbar{text-align:center;margin:12px auto 0;font-size:13px;font-weight:700;color:var(--amber);min-height:20px}
  .cols{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
  @media(min-width:820px){.cols{grid-template-columns:1fr 300px}}
  .card{background:#2a2018cc;border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:0 6px 18px #0006}
  .log{height:200px;overflow-y:auto;font-size:12px;line-height:1.6}
  .log .li{padding:2px 0;border-bottom:1px solid #ffffff0d}
  .log .li .t{color:#a98c63;font-size:10px;margin-right:6px}
  .log .li.gate{color:#f0c47a;font-weight:800}.log .li.fail{color:#e08a6a;font-weight:700}.log .li.win{color:#8fd07a;font-weight:800}
  .legend h3{margin:0 0 8px;font-size:14px;color:#f0dbaa}
  .legend .r{display:flex;align-items:center;gap:8px;padding:2px 0;font-size:11.5px;color:#d9c39a}
  .legend .r b{color:#f6ecd4}.legend .dot{width:11px;height:11px;border-radius:3px;box-shadow:0 1px 2px #0007;flex:0 0 auto}
  .rooms{font-size:11px;color:#b89a70;margin-top:8px;line-height:1.5}
  .confetti{position:fixed;top:-20px;font-size:20px;z-index:99;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(108vh) rotate(520deg);opacity:0}}

  /* ---- layout: office + right chat ---- */
  .main{display:flex;gap:14px;align-items:stretch;margin-top:4px}
  @media(max-width:940px){.main{flex-direction:column}}
  .left{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:8px}
  /* desktop: fit the viewport, office fills height, chat + team scroll internally (no page scroll) */
  @media(min-width:941px){
    .main{height:calc(100vh - 132px);min-height:470px}
    .left{min-height:0}
    .frame{flex:1 1 auto;min-height:0}
    .view{width:auto;height:100%;max-width:100%}
    .chat{min-height:0}
    .msgs{min-height:0}
    .legend.strip{max-height:52px;overflow-y:auto}
  }
  .chat{width:340px;flex:0 0 340px;display:flex;flex-direction:column;background:#20160f;
    border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 12px 34px #0008}
  @media(max-width:940px){.chat{width:auto;flex:1 1 auto;height:380px}}
  .chat-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(135deg,#2f6f68,#245852);color:#fff}
  .chat-head .hav{width:36px;height:36px;border-radius:50%;background:#e07e2e;display:grid;place-items:center;font-size:18px;box-shadow:0 2px 6px #0005}
  .chat-head b{font-size:14px}.chat-head .st{font-size:11px;opacity:.92}.chat-head .st b{color:#a8f0c8}
  .msgs{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px;background:#17110c}
  .msgs .hint{color:#8a7452;font-size:12.5px;text-align:center;margin:auto;max-width:230px;line-height:1.55}
  .mrow{display:flex;gap:7px;align-items:flex-end;max-width:100%}
  .mrow.me{justify-content:flex-end}
  .mav{width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:11px;color:#fff;font-weight:800;box-shadow:0 1px 3px #0006}
  .mb{max-width:80%;padding:7px 10px;border-radius:13px;font-size:12.5px;line-height:1.38;box-shadow:0 1px 4px #0004;word-wrap:break-word;overflow-wrap:anywhere}
  .mb .who{display:block;font-size:9.5px;font-weight:800;opacity:.6;margin-bottom:1px}
  .mrow.agent .mb{background:#fff;color:#241a12;border-bottom-left-radius:4px}
  .mrow.orc .mb{background:#f0e5cf;color:#241a12;border-bottom-left-radius:4px}
  .mrow.me .mb{background:linear-gradient(135deg,#3f9f95,#2d7a71);color:#fff;border-bottom-right-radius:4px}
  .mrow.gate{justify-content:center}
  .mrow.gate .mb{background:#3a2c1e;color:#f0c47a;font-weight:800;border-radius:20px;text-align:center;font-size:11.5px;max-width:92%}
  .mrow.gate.win .mb{background:#20401f;color:#9fe0a8}.mrow.gate.fail .mb{background:#4a2620;color:#f0a494}
  .chat-in{display:flex;gap:8px;padding:10px;border-top:1px solid #3a2c1e;background:#20160f}
  .chat-in input{flex:1;border:1px solid #4a3826;background:#17110c;color:#f2e6cc;border-radius:20px;padding:10px 14px;font-size:13px;font-family:inherit}
  .chat-in input:focus{outline:2px solid var(--teal)}
  .chat-in button{width:42px;height:42px;border-radius:50%;flex:0 0 auto;border:none;color:#fff;font-size:15px;cursor:pointer;
    background:linear-gradient(135deg,#3f9f95,#2d7a71);display:grid;place-items:center;padding:0}
  .chat-in button:disabled{opacity:.45;cursor:not-allowed}
  /* indicators */
  .infobar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:center;
    background:#2a2018cc;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px}
  .infobar .st{color:var(--amber);font-weight:700;margin-right:auto}
  .ind{display:inline-flex;align-items:center;gap:5px;color:#c9b48c}
  .ind i{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 5px currentColor}
  .sdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle;background:#9a9a9a;box-shadow:0 0 4px currentColor}
  .legend.strip{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
  .legend.strip h3{width:100%;margin:0 0 4px}
  .legend.strip .r{font-size:11px;padding:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="logo">🏢</div>
    <div>
      <h1>Chveni Sopeli · <span style="color:var(--amber)">Garage</span></h1>
      <div class="tagline">cozy ოფისი — <b>მალე კომპანია</b>. დაწერე დავალება ჩატში, ორკესტრატორი გუნდს გაანაწილებს 🎭</div>
    </div>
  </div>

  <div class="main">
    <div class="left">
      <div class="frame">
        <div class="view">
          <canvas id="scene" width="512" height="320"></canvas>
          <div class="overlay" id="overlay"></div>
        </div>
      </div>
      <div class="infobar">
        <span class="st" id="statusbar">☕ გუნდი ოფისშია…</span>
        <span class="ind"><i style="background:#55c46a;color:#55c46a"></i>მუშაობს</span>
        <span class="ind"><i style="background:#9a9a9a;color:#9a9a9a"></i>idle</span>
      </div>
      <div class="card legend strip" id="legend"><h3>🎭 გუნდი</h3></div>
    </div>

    <div class="chat">
      <div class="chat-head">
        <div class="hav">🎭</div>
        <div><b>ორკესტრატორი</b><div class="st">გუნდი • <b>11 online</b></div></div>
      </div>
      <div class="msgs" id="msgs">
        <div class="hint">👋 დაწერე დავალება ქვემოთ.<br>ორკესტრატორი თავად გადაწყვეტს მიმართულებას და გუნდს გაანაწილებს.</div>
      </div>
      <div class="chat-in">
        <input id="taskInput" type="text" placeholder="დაწერე დავალება…">
        <button id="sendBtn" title="გაგზავნა">➤</button>
      </div>
    </div>
  </div>
</div>

<script>
// ===== consts =====
const TS=16, COLS=32, ROWS=20, W=COLS*TS, H=ROWS*TS;
const cv=document.getElementById('scene'), ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
const overlay=document.getElementById('overlay');

// ===== palette (office) =====
const P={
  wallExt:'#cdb185', wallExtHi:'#e0c79b', wallInt:'#e2d3b0', rail:'#8a5a34', base:'rgba(60,38,20,.22)',
  brick:['#9a5a44','#8a4e3a','#a5644c'], mortar:'#5a3527',
  woodF:'#6b4a2e', glass:'rgba(150,205,210,.42)', glassHi:'rgba(255,255,255,.4)',
  parquet:['#b8834f','#a9743f','#c08a58','#ab7748'], parquetSeam:'#6f4a26', parquetGrain:'rgba(80,48,22,.28)',
  bathTile:['#e2e7df','#cad1c6'], bathSeam:'rgba(0,0,0,.09)', seam:'#8a6236',
  wood:'#7c4a2a', woodD:'#5a3420', woodL:'#9c6636',
  glassW1:'#8fcabf', glassW2:'#5fa79b', sill:'#8a5a34', frame:'#6b4a2e',
  leaf:['#5fa24a','#478a3c','#6fb457'], pot:'#b5674a', potD:'#8a4a34',
  book:['#a94a52','#4f8a4a','#c9903a','#5a7fa0','#8a5a9a','#c56b4a','#3f8f88'],
  rug:['#a94a52','#c56b74','#3f8f88','#d99a4a'], metal:'#8a929a', metalD:'#5a626a',
  shadow:'rgba(0,0,0,.22)'
};

// ===== agents =====
const AGENTS=[
  {id:'nino',  name:'ნინო',  role:'BA · speც',   model:'sonnet', shirt:'#3f8f88',hair:'#7a3f28',skin:'#eabf95', c:3, r:7, room:0},
  {id:'giorgi',name:'გიორგი',role:'არქიტექტორი', model:'sonnet', shirt:'#5a7fa0',hair:'#2a2420',skin:'#d8a877', c:6, r:7, room:0},
  {id:'tamar', name:'თამარ', role:'დიზაინერი',   model:'sonnet', shirt:'#c56b4a',hair:'#a5432a',skin:'#eabf95', c:11,r:7, room:1},
  {id:'lela',  name:'ლელა',  role:'Frontend',    model:'sonnet', shirt:'#8a5a9a',hair:'#3a2a22',skin:'#eabf95', c:14,r:7, room:1},
  {id:'vakho', name:'ვახო',  role:'Backend',     model:'sonnet', shirt:'#6f9a54',hair:'#2a2420',skin:'#d8a877', c:19,r:7, room:2},
  {id:'zaza',  name:'ზაზა',  role:'DevOps',      model:'haiku',  shirt:'#d99a34',hair:'#2a2420',skin:'#cf9866', c:22,r:7, room:2},
  {id:'dato',  name:'დათო',  role:'Code Review', model:'sonnet', shirt:'#5c6f7d',hair:'#4a4038',skin:'#d8a877', c:5, r:17,room:4},
  {id:'mariam',name:'მარიამ',role:'QA',          model:'haiku',  shirt:'#cf6f93',hair:'#5a3320',skin:'#eabf95', c:11,r:17,room:5},
  {id:'beka',  name:'ბექა',  role:'Verifier',    model:'sonnet', shirt:'#4e8d5b',hair:'#2a2420',skin:'#d8a877', c:14,r:17,room:5},
  {id:'irakli',name:'ირაკლი',role:'Auditor 👑',  model:'sonnet', shirt:'#3a4a5e',hair:'#6b6b6b',skin:'#cf9866', c:20,r:17,room:6},
  {id:'maestro',name:'მაესტრო',role:'ორკესტრატ.',model:'—',      shirt:'#e07e2e',hair:'#2a2420',skin:'#d8a877', c:2, r:11,room:8},
];
const byId={}; AGENTS.forEach(a=>byId[a.id]=a);

// ===== rooms (labels) =====
const ROOMS=[
  {t:'📋 Spec',c:4,r:2.4}, {t:'🎨 Design',c:12,r:2.4}, {t:'⚙️ Dev',c:20,r:2.4}, {t:'☕ Break Room',c:27.5,r:2.4},
  {t:'🔍 Review',c:4,r:13.4}, {t:'🧪 QA',c:12,r:13.4}, {t:'🕵️ Audit',c:20,r:13.4}, {t:'🚻 WC',c:27.5,r:13.4},
  {t:'🛎️ Reception',c:4,r:10.4},
];

// ===== grid: 0 floor,1 wall,2 block =====
const grid=[];
for(let r=0;r<ROWS;r++){grid.push([]);for(let c=0;c<COLS;c++){
  let w=0;
  if(r<=1||r===ROWS-1||c===0||c===COLS-1) w=1;
  if(r===9||r===12) w=1;
  if((c===8||c===16||c===24) && ((r>=2&&r<=9)||(r>=12&&r<=18))) w=1;
  grid[r][c]=w;
}}
[[9,4],[9,12],[9,20],[9,28],[12,4],[12,12],[12,20],[12,28]].forEach(([r,c])=>grid[r][c]=0);
AGENTS.forEach(a=>{ if(a.id!=='maestro') grid[a.r-1][a.c]=2; });
grid[11][1]=2;                 // reception desk
grid[10][15]=2; grid[10][16]=2;// meeting table
// break room furniture blocks
grid[3][26]=2; grid[3][27]=2; grid[3][28]=2;  // sofa
grid[6][27]=2;                                 // coffee table
// wc furniture
grid[14][27]=2;                                // toilet
grid[14][29]=2;                                // sink
const open=(c,r)=>r>=0&&r<ROWS&&c>=0&&c<COLS&&grid[r][c]===0;

// ===== static scene =====
const scene=document.createElement('canvas'); scene.width=W; scene.height=H;
const sx=scene.getContext('2d'); sx.imageSmoothingEnabled=false;
const Rr=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x|0,y|0,Math.max(1,w|0),Math.max(1,h|0));};
const ell=(g,cx,cy,rx,ry,c)=>{g.fillStyle=c;g.beginPath();g.ellipse(cx,cy,rx,ry,0,0,7);g.fill();};
function shade(hex,d){let n=parseInt(hex.slice(1),16),r=(n>>16)+d,g=((n>>8)&255)+d,b=(n&255)+d;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
const sd=i=>((Math.sin(i*127.1)*43758.5)%1+1)%1;

const isWC=(c,r)=>c>=25&&r>=13&&r<=18;
function floorTile(c,r){
  const x=c*TS,y=r*TS;
  if(isWC(c,r)){ // small bathroom tiles
    for(let i=0;i<2;i++)for(let j=0;j<2;j++) Rr(sx,x+i*8,y+j*8,8,8,((i+j+c+r)%2)?P.bathTile[0]:P.bathTile[1]);
    Rr(sx,x,y,TS,1,P.bathSeam); Rr(sx,x,y+8,TS,1,P.bathSeam); Rr(sx,x,y,1,TS,P.bathSeam); Rr(sx,x+8,y,1,TS,P.bathSeam);
    return;
  }
  // wood parquet — alternating block orientation (basket-weave)
  const woods=P.parquet, base=woods[((c*3+r*5)%woods.length+woods.length)%woods.length];
  const horiz=((c+r)%2)===0;
  if(horiz){ for(let i=0;i<4;i++){ const py=y+i*4;
    Rr(sx,x,py,TS,4,shade(base,i%2?7:-4)); Rr(sx,x,py+3,TS,1,P.parquetSeam);
    Rr(sx,x+(i%2?3:9),py+1,5,1,P.parquetGrain); } }
  else { for(let i=0;i<4;i++){ const px=x+i*4;
    Rr(sx,px,y,4,TS,shade(base,i%2?7:-4)); Rr(sx,px+3,y,1,TS,P.parquetSeam);
    Rr(sx,px+1,y+(i%2?3:9),1,5,P.parquetGrain); } }
  Rr(sx,x,y,TS,1,'rgba(55,34,16,.20)'); Rr(sx,x,y,1,TS,'rgba(55,34,16,.20)'); // parquet block border
}
function drawScene(){
  // floor
  for(let r=2;r<ROWS-1;r++)for(let c=1;c<COLS-1;c++){
    if(grid[r][c]===1)continue;
    floorTile(c,r);
  }
  // walls
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(grid[r][c]!==1)continue;
    const ext=(r<=1||r===ROWS-1||c===0||c===COLS-1);
    const brickAccent = (r<=1 && c>=25 && c<=30); // break room exposed brick
    if(brickAccent){
      const b=P.brick[(c+r)%3]; Rr(sx,c*TS,r*TS,TS,TS,b);
      Rr(sx,c*TS,r*TS+7,TS,1,P.mortar); Rr(sx,c*TS,r*TS+15,TS,1,P.mortar);

// ===== pathfinding =====
function bfs(sc,sr,gc,gr){
  if(!open(gc,gr)||(sc===gc&&sr===gr))return [];
  const q=[[sc,sr]],prev={},seen=new Set([sr*COLS+sc]),dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  while(q.length){const [c,r]=q.shift();
    if(c===gc&&r===gr){const p=[];let k=r*COLS+c;while(k!==sr*COLS+sc){const cc=k%COLS,rr=(k-cc)/COLS;p.unshift({c:cc,r:rr});k=prev[k];}return p;}
    for(const[dc,dr]of dirs){const nc=c+dc,nr=r+dr,key=nr*COLS+nc;
      if(open(nc,nr)&&!seen.has(key)){seen.add(key);prev[key]=r*COLS+c;q.push([nc,nr]);}}}
  return [];
}

  a.seat={c:a.c,r:a.r};a.face='down';a.frame=0;a.path=[];a.moveRes=null;a.busy=false;a.tok=0;
  a.emote=null;a.think=false;a.act='idle';a.interrupt=false;a.wob=0;});
const SPEED=0.5; // realistic walking pace
function moveTo(a,c,r){return new Promise(res=>{a.path=bfs(a.tc,a.tr,c,r);a.moveRes=res;if(!a.path.length){a.moveRes=null;res();}});}
function updateMove(a){
  if(a.interrupt){a.interrupt=false;a.path=[];if(a.moveRes){const f=a.moveRes;a.moveRes=null;f();}}
  if(!a.path.length)return;
  const t=a.path[0],tx=t.c*TS+TS/2,ty=t.r*TS+TS,dx=tx-a.px,dy=ty-a.py,d=Math.hypot(dx,dy);
  a.face=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');
  if(d<=SPEED){a.px=tx;a.py=ty;a.tc=t.c;a.tr=t.r;a.path.shift();
    if(!a.path.length&&a.moveRes){const f=a.moveRes;a.moveRes=null;f();}}
  else{a.px+=dx/d*SPEED;a.py+=dy/d*SPEED;}
}

let TICK=0;
function drawChar(g,a){
  const walking=a.path.length>0;
  let x=Math.round(a.px), y=Math.round(a.py);
  const dancing=a.act==='dance';
  if(dancing) x+=Math.round(Math.sin(TICK*0.25)*2);
  const sitting=(a.act==='sit'||a.act==='rest');
  ell(g,x,y-1,6,2,P.shadow);
  const pants='#3a2a1e', fr=Math.floor((walking?TICK:0)/6)%2;
  // legs
  if(sitting){Rr(g,x-3,y-4,2,3,pants);Rr(g,x+1,y-4,2,3,pants);}
  else if(walking||dancing){const f=Math.floor(TICK/9)%2;
    if(f===0){Rr(g,x-3,y-4,2,4,pants);Rr(g,x+1,y-3,2,3,pants);}else{Rr(g,x-3,y-3,2,3,pants);Rr(g,x+1,y-4,2,4,pants);}}
  else{Rr(g,x-3,y-4,2,4,pants);Rr(g,x+1,y-4,2,4,pants);}
  // torso
  Rr(g,x-4,y-11,8,7,a.shirt); Rr(g,x-4,y-5,8,1,shade(a.shirt,-25));
  // arms
  if(dancing){Rr(g,x-6,y-14,2,6,shade(a.shirt,-8));Rr(g,x+4,y-14,2,6,shade(a.shirt,-8));}
  else{const armY=a.act==='work'?(Math.floor(TICK/6)%2?y-10:y-9):y-10;
    Rr(g,x-5,y-10,2,5,shade(a.shirt,-8));Rr(g,x+3,armY,2,5,shade(a.shirt,-8));}
  // head
  Rr(g,x-3,y-17,6,6,a.skin);
  // hair
  if(a.face==='up'){Rr(g,x-3,y-18,6,5,a.hair);}
  else{Rr(g,x-3,y-18,6,3,a.hair);Rr(g,x-3,y-17,1,3,a.hair);Rr(g,x+2,y-17,1,3,a.hair);}
  // face
  if(a.face!=='up'){
    if(a.act==='rest'){Rr(g,x-2,y-13,2,1,'#2a241f');Rr(g,x+1,y-13,2,1,'#2a241f');} // closed eyes
    else if(a.face==='left')Rr(g,x-2,y-14,1,1,'#2a241f');
    else if(a.face==='right')Rr(g,x+1,y-14,1,1,'#2a241f');
    else{Rr(g,x-2,y-14,1,1,'#2a241f');Rr(g,x+1,y-14,1,1,'#2a241f');}
  }
}

  if(Math.random()<0.9){                       // ~90%: stay in own room, quietly work at desk (no walking about)
    if(a.tc!==a.seat.c||a.tr!==a.seat.r){ await moveTo(a,a.seat.c,a.seat.r); if(a.tok!==tok)return rest(a); }
    a.act='work'; a.face='up'; setThink(a,pick(WORK_THOUGHTS));
    await hold(a,tok,3200+Math.random()*3200,WORK_THOUGHTS);
  } else {                                      // ~10%: rare break — go to Break Room / WC, then return
    const s=pick(ACTS);
    await moveTo(a,s.tile.c,s.tile.r); if(a.tok!==tok)return rest(a);
    a.act=s.act; a.face='down'; setThink(a,pick(s.think));
    await hold(a,tok,2600+Math.random()*2600,s.think);
    a.act='idle';a.emote=null;a.think=false;
    await moveTo(a,a.seat.c,a.seat.r);          // walk back to own room
  }
  rest(a);
}
function rest(a){a.act='idle';a.emote=null;a.think=false;a.busy=false;a.face='down';}
setInterval(()=>{const c=AGENTS.filter(x=>!x.busy);if(c.length&&Math.random()<0.5)idle(pick(c));},4000);

// ===== routes =====
const S=(agent,label,msg,dur,ex={})=>({agent,label,msg,dur,...ex});
const routes={
  feature:()=>[
    S('nino','📝','ვწერ speც-ს — user stories + API + ACs + Security',1600,{gate:'✅ SPEC',gl:'GATE 1 — user-მ speც დაამტკიცა'}),
    S('maestro','🎯','spike — riskiest assumption (<2სთ)',800,{gate:'✅ SPIKE',gl:'GATE 2 — spike დადასტურდა'}),
    S('tamar','🎨','wireframe + village palette',1400),
    S('vakho','⚙️','FastAPI route, model, tests',1600),
    S('lela','💻','React UI — map/chat, mobile-first',1500),
    S('dato','🔍','code review — correctness + security',1500,{fail:true,gate:'✅ PASS',gl:'commit gate — code-review PASS'}),
    S('maestro','🛡️','dep scan — pip-audit + npm audit',700),
    S('mariam','🧪','pytest + N-1 regression',1400,{gate:'✅ 107/107',gl:'QA — ყველა AC pass'}),
    S('beka','🛰️','E2E verify — docker → seed → endpoints',1200),
    S('irakli','🕵️','tech audit — live DB/API/LLM',1600,{fail:true,gate:'GO ✅',gl:'tech-auditor: HEALTHY → GO'}),
    S('maestro','🚦','human gate — user მოიწონა',900,{gate:'🎉 SHIPPED',gl:'HUMAN GATE — ჩაიწერა phases.md-ში',win:true}),
  ],
  backend:()=>[
    S('nino','📝','speც — API contract + data model',1500,{gate:'✅ SPEC',gl:'GATE 1 — speც approved'}),
    S('giorgi','📐','design doc — ADR + interfaces',1400),
    S('vakho','⚙️','FastAPI — routes, migrations',1700),
    S('dato','🔍','deep review — security + errors',1600,{fail:true,gate:'✅ PASS',gl:'commit gate — PASS'}),
    S('maestro','🛡️','dep scan',700),
    S('mariam','🧪','pytest + regression',1400,{gate:'✅ TESTS',gl:'QA — ACs pass'}),
    S('beka','🛰️','verify — endpoints + curl',1100),
    S('irakli','🕵️','audit — DB + API',1600,{fail:true,gate:'GO ✅',gl:'tech-auditor GO'}),
    S('maestro','🚦','human gate',900,{gate:'🎉 SHIPPED',gl:'HUMAN GATE passed',win:true}),
  ],
  deploy:()=>[
    S('nino','📝','deploy speც — infra + Security',1500,{gate:'✅ SPEC',gl:'GATE 1 — speც approved'}),
    S('zaza','🔌','railway.toml, vercel.json, env',1700),
    S('dato','🔍','config review — secrets + CORS',1300,{gate:'✅ PASS',gl:'commit gate — PASS'}),
    S('maestro','🛡️','npm audit → 0 vulns',800),
    S('mariam','🧪','107/107 regression',1200,{gate:'✅ 107/107',gl:'QA regression pass'}),
    S('irakli','🕵️','live system audit',1600,{fail:true,gate:'GO ✅',gl:'tech-auditor GO'}),
    S('maestro','🚦','human gate — live URL',900,{gate:'🚀 LIVE',gl:'HUMAN GATE — production live',win:true}),
  ],
};
const PRESET_TXT={feature:'ახალი ჩატ ფიჩერი',backend:'ახალი API endpoint',deploy:'Deploy → Railway + Vercel'};

// ===== runner (room-to-room delivery) =====
let running=false, runResults=[];
async function work(a,st,retry){
  a.face='up';a.act='work';a.emote=st.label;a.think=false;
  if(!retry) chatAgent(a, `${st.label} ${st.msg}`);
  status(`${a.name} მუშაობს — ${st.msg}`);
  await sleep(st.dur);
}
async function step(st,nextId){
  const a=byId[st.agent]; recruit(a);
  status(`${a.name} მიდის ასაღებად…`);
  await moveTo(a,ticketTile.c,ticketTile.r);   // go to the room where the task is
  ticketHolder=a;
  await moveTo(a,a.seat.c,a.seat.r);            // carry it to own desk
  await work(a,st,false);

  if(st.fail && Math.random()<0.4){
    a.act='idle';a.emote=null; await doStamp(a,'❌ FAIL',false);
    chatGate(`❌ ${a.name}: ვერ გავიდა — ვახოსთან ბრუნდება 🔧`,'fail');
    // carry it back to Dev room
    await moveTo(a,byId.vakho.seat.c,byId.vakho.seat.r);
    ticketHolder=null; ticketTile={c:byId.vakho.seat.c,r:byId.vakho.seat.r};
    moveTo(a,a.seat.c,a.seat.r).then(()=>a.busy=false);
    await step(S('vakho','🔧','ვასწორებ '+a.name+'-ის შენიშვნებს',1300), st.agent); // vakho fixes, delivers back
    recruit(a); status(`${a.name} ხელახლა ამოწმებს…`);
    await moveTo(a,ticketTile.c,ticketTile.r); ticketHolder=a; await moveTo(a,a.seat.c,a.seat.r);
    chatAgent(a,'🔁 ხელახალი review…'); await work(a,st,true);
  }
  if(st.gate){a.act='idle'; await doStamp(a,st.gate,true); chatGate(`🚦 ${st.gl}`, st.win?'win':''); runResults.push(st.gl);}
  a.act='idle';a.emote=null;a.face='down';

  if(nextId){const b=byId[nextId]; status(`${a.name} აბარებს ${b.name}-ს…`);
    await moveTo(a,b.seat.c,b.seat.r);                      // carry finished work to next room
    ticketHolder=null; ticketTile={c:b.seat.c,r:b.seat.r};
    moveTo(a,a.seat.c,a.seat.r).then(()=>a.busy=false);     // stroll home
  } else { ticketHolder=null; a.busy=false; }
}
// orchestrator decides the direction from the task text
const ROUTE_NAME={feature:'🆕 Feature',backend:'🔧 Backend',deploy:'🚀 Deploy'};
const ROUTE_WHY={feature:'UI / პროდუქტის ფიჩერი',backend:'backend / API ცვლილება',deploy:'დეპლოი / ინფრა'};
function decideRoute(text){const t=(text||'').toLowerCase();
  if(/deploy|დეპლ|railway|vercel|ჰოსტ|prod|launch|გავუშვ|live/.test(t)) return 'deploy';
  if(/\bapi\b|backend|ბექენ|endpoint|route|რაუტ|model|მოდელ|migrat|მიგრაც|schema|სქემ|\bdb\b|ბაზ|query|crud/.test(t)) return 'backend';
  return 'feature';}
async function run(text,forced){
  if(running)return; running=true; setBtns(false);
  chatUser(text);
  const key=forced||decideRoute(text);
  await sleep(500);
  chatOrc(`მივიღე ✅ მიმართულება: <b>${ROUTE_NAME[key]}</b> — ${ROUTE_WHY[key]}. ვანაწილებ გუნდს… 🚀`);
  document.getElementById('tkTxt').textContent=text.length>22?text.slice(0,22)+'…':text;
  ticketHolder=null; ticketTile={c:byId.maestro.c,r:byId.maestro.r}; ticketEl.style.opacity='1';
  runResults=[];
  const route=routes[key]();
  for(let i=0;i<route.length;i++){ await step(route[i], route[i+1]?.agent); }
  ticketEl.style.opacity='0'; status('🎉 დასრულდა და ჩაბარდა!');
  chatGate('🎉 დასრულდა და ჩაბარდა!','win');
  const commit=Math.random().toString(16).slice(2,9);
  chatOrc(`✅ <b>დასრულდა — ${ROUTE_NAME[key]}</b>. გავლილი gate-ები:<br>`+
    runResults.map(r=>'• '+r).join('<br>')+
    `<br><br>🔎 <b>როგორ შევამოწმო:</b> ეს office არის workflow-ის ვიზუალიზაცია. ნამდვილი შედეგი — commit/PR, ტესტები, ფაილები — რეალურ repo-შია. (demo commit <code>${commit}</code>)`);
  confetti();
  running=false; setBtns(true);
}
function setBtns(on){const i=document.getElementById('taskInput'),b=document.getElementById('sendBtn');if(i)i.disabled=!on;if(b)b.disabled=!on;}
function confetti(){const em=['🎉','✨','🍷','🎊','⭐','🌿'];for(let i=0;i<28;i++){const s=document.createElement('div');s.className='confetti';s.textContent=pick(em);s.style.left=Math.random()*100+'vw';s.style.animationDuration=(2+Math.random()*2)+'s';s.style.animationDelay=(Math.random()*.6)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),4200);}}

const taskInput=document.getElementById('taskInput'), sendBtn=document.getElementById('sendBtn');
function send(){const t=taskInput.value.trim();if(!t||running)return;taskInput.value='';run(t);}
sendBtn.onclick=send;
taskInput.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
// kick off office life so it looks busy immediately (not everyone resting)
AGENTS.forEach((a,i)=>setTimeout(()=>{if(!a.busy)idle(a);},300+i*220));
// Real-time bridge: open with ?task=...&route=feature|backend|deploy&run=1 (or #demo)
const params=new URLSearchParams(location.search);
const qTask=params.get('task'), qRoute=params.get('route');
if(qTask) taskInput.value=qTask;
if(location.hash==='#demo' || params.get('run')==='1'){
  setTimeout(()=>run(qTask||'ახალი ჩატ ფიჩერი', routes[qRoute]?qRoute:null), 700);
}

// ===== LIVE MODE: driven by Claude via live/status.json =====
// open with ?live=1 (served over a local http server). Claude appends events to
// live/status.json as it does the real work; the office mirrors it in real time.
if(params.get('live')==='1'){
  const stEl=document.querySelector('.chat-head .st');
  if(stEl) stEl.innerHTML='🔴 <b>LIVE</b> — Claude-ის მართვით';
  taskInput.placeholder='🔴 live — დავალებას Claude ამუშავებს ჩატში…';
  taskInput.disabled=true; sendBtn.disabled=true;
  document.getElementById('tkTxt').textContent='LIVE';
  let liveSeq=-1, cursor=0, queue=[], proc=false, liveActive=null;
  async function poll(){
    try{
      const r=await fetch('live/status.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok)return;
      const s=await r.json(); if(s.seq===liveSeq)return; liveSeq=s.seq;
      const evs=s.events||[]; for(const e of evs.slice(cursor)) queue.push(e); cursor=evs.length; pump();
    }catch(e){}
  }
  async function pump(){ if(proc)return; proc=true; while(queue.length){ await handle(queue.shift()); } proc=false; }
  async function handle(e){
    if(e.type==='reset'){ liveActive=null; ticketHolder=null; ticketEl.style.opacity='0';
      const m=document.getElementById('msgs'); if(m) m.innerHTML=''; return; }
    if(e.type==='user'){ chatUser(e.text); return; }
    if(e.type==='orc'){ chatOrc(e.text); return; }
    if(e.type==='start'){ const a=byId[e.agent]; if(!a)return;
      if(liveActive&&liveActive!==a){ liveActive.act='idle';liveActive.emote=null;liveActive.busy=false; }
      recruit(a); status(`${a.name}: ${e.label||''}`);
      await moveTo(a,ticketTile.c,ticketTile.r); ticketHolder=a; ticketEl.style.opacity='1';
      await moveTo(a,a.seat.c,a.seat.r);
      a.face='up'; a.act='work'; a.emote=e.label||'⚙️'; ticketTile={c:a.seat.c,r:a.seat.r};
      liveActive=a; chatAgent(a, e.text||e.label||'…'); return; }
    if(e.type==='gate'){ if(liveActive){ liveActive.act='idle'; await doStamp(liveActive,e.text,e.kind!=='fail'); liveActive.act='work'; }
      chatGate('🚦 '+e.text, e.kind==='fail'?'fail':(/🎉|✅|GO|PASS|SHIP|LIVE/i.test(e.text)?'win':'')); return; }
    if(e.type==='done'){ if(liveActive){ liveActive.act='idle';liveActive.emote=null;liveActive.busy=false;liveActive=null; }
      ticketHolder=null; ticketEl.style.opacity='0';
      if(e.text) chatOrc(e.text); chatGate('🎉 დასრულდა','win'); confetti(); return; }
  }
  setInterval(poll,900); poll();
}
